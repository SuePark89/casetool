const TOSS_CLIENT_KEY="test_ck_여기에_클라이언트_키",ORDER_KEY="casetool-order";
const ADJ=["따뜻한","푸른","고요한","환한","단단한","느린","맑은","깊은","작은","부드러운","든든한","새로운","잔잔한","용감한","향기로운","반짝이는","포근한","씩씩한","다정한","높은"];

const K="#44574c",RD="#b44747",FONT="system-ui,'Noto Sans KR','Malgun Gothic',sans-serif";
let D=[],C=null,T="info",sel=null,tool=null,from=null,drag=null,pend=null;

const $=id=>document.getElementById(id);

const say=t=>{const s=$("st");if(s)s.textContent=t};
const G=()=>C[T];
const node=id=>G().nodes.find(n=>n.id===id);
const edge=id=>G().edges.find(e=>e.id===id);
const nodeLabel=n=>n.client?(C.info.name||(n.type==="center"?C.alias:n.label)):n.label;

const wrap=(s,n,l)=>{s=String(s);const a=[];for(let i=0;i<l&&i*n<s.length;i++)a.push(s.slice(i*n,(i+1)*n));if(s.length>n*l)a[l-1]=a[l-1].slice(0,n-1)+"…";return a};

function load(){try{D=JSON.parse(localStorage.getItem(KEY)||"[]");D.forEach(c=>c.eco.nodes.forEach(n=>{if(n.type==="center")n.client=1}))}catch(e){D=[]}}
function save(){if(C)C.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function newAlias(){

  for(let i=0;i<300;i++){const a=ADJ[Math.random()*ADJ.length|0]+" "+NOUN[Math.random()*NOUN.length|0];if(!used.has(a))return a}
  return ADJ[0]+" "+NOUN[0]+" "+(D.length+1);
}

function mk(){
  const id=Date.now();
  const n=(i,type,label,x,y,o)=>Object.assign({id:i,type,label,x,y,age:"",dead:0,ip:0},o||{});

    geno:{nodes:[n(1,"male","친조부",70,55),n(2,"female","친조모",150,55),n(3,"male","외조부",250,55),n(4,"female","외조모",330,55),
      n(5,"male","아버지",110,185),n(6,"female","어머니",290,185),
      n(7,"unknown","본인",150,325,{ip:1,client:1}),n(8,"unknown","형제·자매",250,325)],
     edges:[e(11,1,2,"marriage"),e(12,3,4,"marriage"),e(13,5,6,"marriage"),e(14,1,5,"parent"),e(15,3,6,"parent"),e(16,5,7,"parent"),e(17,5,8,"parent"),e(18,7,8,"close")]},
    eco:{nodes:[n(21,"center","",200,260,{client:1}),n(22,"학교","학교",200,70),n(23,"기관","기관",345,150),n(24,"친구","친구",345,370),n(25,"직장","직장",55,370),n(26,"모임","모임",55,150)],
     edges:[e(31,21,22,"normal","both"),e(32,21,23,"strong","in"),e(33,21,24,"weak"),e(34,21,25,"stress","out"),e(35,21,26,"tenuous")]}
  };
}

/* ---------- 선·도형 그리기 (화면·내보내기 공용) ---------- */
function lineBody(k,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux;
  const f=v=>v.toFixed(1),P=(t,o)=>[x1+dx*t+px*(o||0),y1+dy*t+py*(o||0)];
  const ln=(o,c,w,a,b,x)=>{const A=P(a??0,o),B=P(b??1,o);return `<line x1="${f(A[0])}" y1="${f(A[1])}" x2="${f(B[0])}" y2="${f(B[1])}" stroke="${c||K}" stroke-width="${w||2}" ${x||""}/>`};
  const zz=()=>{const p=[];for(let i=0;i<=14;i++){const q=P(i/14,(i===0||i===14)?0:(i%2?6:-6));p.push(f(q[0])+","+f(q[1]))}return `<polyline points="${p.join(" ")}" fill="none" stroke="${RD}" stroke-width="1.2"/>`};
  const tk=(t,h,c)=>{const A=P(t,h),B=P(t,-h);return `<line x1="${f(A[0]-ux*3)}" y1="${f(A[1]-uy*3)}" x2="${f(B[0]+ux*3)}" y2="${f(B[1]+uy*3)}" stroke="${c||K}" stroke-width="1.2"/>`};
  const hd=(x,y,s)=>{const hx=x-ux*s*10,hy=y-uy*s*10;return `<polygon points="${f(x)},${f(y)} ${f(hx+px*5)},${f(hy+py*5)} ${f(hx-px*5)},${f(hy-py*5)}" fill="${K}"/>`};
  let s;
  switch(k){
    case "strong":s=ln(0,K,5);break;
    case "weak":s=ln(0,K,2,0,1,'stroke-dasharray="9 6"');break;
    case "tenuous":case "distant":s=ln(0,K,2.5,0,1,'stroke-dasharray="1 6" stroke-linecap="round"');break;
    case "cohabit":s=ln(0,K,2,0,1,'stroke-dasharray="6 4"');break;
    case "stress":s=ln(0,RD);for(let d=14;d<L-10;d+=11)s+=tk(d/L,7,RD);break;
    case "conflict":s=zz();break;
    case "cutoff":s=ln(0,K,2,0,.4)+ln(0,K,2,.6,1)+tk(.45,8)+tk(.55,8);break;
    case "double":case "close":s=ln(-3)+ln(3);break;
    case "fused":s=ln(-5)+ln(0)+ln(5);break;
    case "fusedconf":s=ln(-5)+ln(0)+ln(5)+zz();break;
    case "separation":s=ln(0)+tk(.5,8);break;
    case "divorce":s=ln(0)+tk(.44,8)+tk(.56,8);break;
    case "abuse":s=zz();break;
    case "focus":s=ln(0);break;
    default:s=ln(0);
  }
  return s;
}
function lineSvg(k,x1,y1,x2,y2,dir){
  dir=dir||"none";
  if((k==="abuse"||k==="focus")&&dir==="none")dir="out";
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux,H=10,f=v=>v.toFixed(1);
  const out=dir==="out"||dir==="both",inn=dir==="in"||dir==="both";
  const hd=(x,y,s)=>{const hx=x-ux*s*H,hy=y-uy*s*H;return `<polygon points="${f(x)},${f(y)} ${f(hx+px*5)},${f(hy+py*5)} ${f(hx-px*5)},${f(hy-py*5)}" fill="${K}"/>`};
  let s=lineBody(k,inn?x1+ux*H:x1,inn?y1+uy*H:y1,out?x2-ux*H:x2,out?y2-uy*H:y2);
  if(out)s+=hd(x2,y2,1);
  if(inn)s+=hd(x1,y1,-1);
  return s;
}
const shape=(t,R,st)=>t==="male"?`<rect x="${-R}" y="${-R}" width="${2*R}" height="${2*R}" ${st}/>`
  :t==="female"?`<circle r="${R}" ${st}/>`
  :t==="preg"?`<polygon points="0,${-R-4} ${R+4},${R} ${-R-4},${R}" ${st}/>`
  :t==="unknown"?`<polygon points="0,${-R-5} ${R+5},0 0,${R+5} ${-R-5},0" ${st}/>`
  :t==="center"?`<ellipse rx="62" ry="38" ${st}/>`:`<circle r="36" ${st}/>`;
const TX=`text-anchor="middle" fill="#25352d" font-family="${FONT}"`;

function nodeSvg(n,mode,on){
  const sc=mode==="geno"?K:"#26745c",st=`fill="${n.type==="center"?"#eef7f2":"#fff"}" stroke="${on?"#1686d9":sc}" stroke-width="${on?3:2}"`;
  const sz=mode==="geno"?1:(n.s||1);
  let s=`<g class="nd" data-id="${n.id}" transform="translate(${n.x} ${n.y})${sz!==1?` scale(${sz})`:""}">`;
  if(mode==="geno"){
    const R=20;
    if(n.ip)s+=shape(n.type,R+5,'fill="none" stroke="#1686d9" stroke-width="1.5"');
    s+=shape(n.type,R,st);
    if(n.dead)s+=`<path d="M${-R} ${-R}L${R} ${R}M${R} ${-R}L${-R} ${R}" stroke="${K}" stroke-width="1.2"/>`;
    s+=`<text y="${R+17}" font-size="11" ${TX}>${esc(cut(nodeLabel(n),6))}</text>`;
    const a=nodeAge(n);if(a)s+=`<text y="${R+29}" font-size="10" ${TX} fill-opacity=".6">${esc(cut(String(a),8))}</text>`;
  }else{
    s+=shape(n.type,0,(n.pot?st+' stroke-dasharray="5 4"':st)+' vector-effect="non-scaling-stroke"');
    const ls=wrap(nodeLabel(n),n.type==="center"?9:6,2);
    s+=ls.map((t,i)=>`<text y="${((i-(ls.length-1)/2)*13+4).toFixed(1)}" font-size="11" ${TX}>${esc(t)}</text>`).join("");
    if(n.pot)s+=`<text y="48" font-size="9" ${TX} fill-opacity=".6">잠재적 자원</text>`;else if(n.type!=="center"&&n.label!==n.type)s+=`<text y="48" font-size="9" ${TX} fill-opacity=".6">${esc(n.type)}</text>`;
  }
  return s+"</g>";
}
const nodeCut=(n,ux,uy,mode)=>mode==="geno"?28:(n.type==="center"?1/Math.sqrt((ux/62)**2+(uy/38)**2)+2:39)*(n.s||1);
const pcFrag=k=>{const d=k==="adopt"?' stroke-dasharray="5 3"':"";return `<g fill="none" stroke="${K}" stroke-width="1.2"><line x1="16" y1="3" x2="48" y2="3"/><polyline points="32,3 32,13 8,13 8,23"${d}/><polyline points="32,13 56,13 56,23"${d}/></g>`};
/* ---------- 가계도 관계선: 가족 구조선 / 관계선 구분, 곡선·자동 우회 ---------- */
const GSTR=["marriage","cohabit","separation","divorce","parent","adopt"],isStr=k=>GSTR.includes(k);
const GREL=Object.fromEntries(Object.entries(GK).filter(([k])=>!isStr(k))),GSTRK=Object.fromEntries(Object.entries(GK).filter(([k])=>isStr(k)));
const f1=v=>v.toFixed(1);
function bez(a,b,off,N){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,cx=(a.x+b.x)/2-dy/L*off*2,cy=(a.y+b.y)/2+dx/L*off*2,P=[];
  for(let i=0;i<=N;i++){const t=i/N,u=1-t;P.push([u*u*a.x+2*u*t*cx+t*t*b.x,u*u*a.y+2*u*t*cy+t*t*b.y])}
  return P;
}
function curveBody(k,P){
  const n=P.length,cum=[0];for(let i=1;i<n;i++)cum.push(cum[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  const L=cum[n-1]||1;
  const nr=i=>{const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[-dy/l,dx/l]};
  const pl=(o,c,w,x,t0,t1)=>{const q=[];for(let i=0;i<n;i++){const t=cum[i]/L;if(t<(t0||0)-1e-9||t>(t1===undefined?1:t1)+1e-9)continue;const m=nr(i);q.push(f1(P[i][0]+m[0]*o)+","+f1(P[i][1]+m[1]*o))}

/* 새 도형이 기존 도형 위에 겹쳐 놓이지 않도록 빈 자리를 찾습니다 */
function freeSpot(d,mode){
  const R=mode==="geno"?26:38,c=[];
  for(let y=40;y<=480;y+=20)for(let x=40;x<=360;x+=20)c.push([x,y]);
  c.sort((p,q)=>Math.hypot(p[0]-200,p[1]-250)-Math.hypot(q[0]-200,q[1]-250));
  const hit=(x,y,n)=>{const k=mode==="geno"?1:(n.s||1),rx=(n.type==="center"?62:(mode==="geno"?28:38))*k,ry=(n.type==="center"?38:(mode==="geno"?40:38))*k;return Math.abs(n.x-x)<rx+R+8&&Math.abs(n.y-y)<ry+R+8};
  return c.find(([x,y])=>!d.nodes.some(n=>hit(x,y,n)))||[200,140];
}

    strip(p);

const cur=()=>sel&&sel.t==="n"?node(sel.id):null;

function typeSet(v){
  const n=cur();if(!n)return;
  const old=n.type,def=t=>T==="geno"?MODES.geno.types[t]:(t==="center"?"가족":t);
  if(n.label===def(old)||n.label===old)n.label=def(v);
  n.type=v;
  if(n.client&&T==="geno"){const s=Object.keys(SXMAP).find(k=>SXMAP[k]===v);if(s)C.info.sex=s}
  save();draw();panel();
}
function delNode(){const d=G();d.nodes=d.nodes.filter(n=>n.id!==sel.id);d.edges=d.edges.filter(e=>e.a!==sel.id&&e.b!==sel.id);sel=null;save();draw();panel()}
const curE=()=>sel&&sel.t==="e"?edge(sel.id):null;
const markOn=(q,k,v)=>document.querySelectorAll(q).forEach(b=>b.classList.toggle("on3",b.dataset[k]===v));
const noDir=e=>T==="geno"&&isStr(e.kind);
function kindSet(v){
  const e=curE();if(!e)return;
  if(T==="geno"&&isStr(v)!==isStr(e.kind)){
    const dup=G().edges.find(x=>x.id!==e.id&&((x.a===e.a&&x.b===e.b)||(x.a===e.b&&x.b===e.a))&&isStr(x.kind)===isStr(v));
    if(dup){sel={t:"e",id:dup.id};draw();panel();say("같은 종류의 선이 이미 있어 그 선을 열었습니다.");return}
  }
  e.kind=v;
  if(T==="geno"){if(isStr(v))e.dir="none";else if((v==="abuse"||v==="focus")&&(e.dir||"none")==="none")e.dir="out"}
  save();draw();panel();say("");
}
function pickEdge(k){
  if(!pendE)return;const d=G(),{a,b}=pendE;
  const dup=d.edges.find(x=>((x.a===a&&x.b===b)||(x.a===b&&x.b===a))&&isStr(x.kind)===isStr(k));
  pendE=null;
  if(dup){sel={t:"e",id:dup.id};draw();panel();say("같은 종류의 선이 이미 있어 그 선을 열었습니다. 종류를 바꿔 보세요.");return}
  const e={id:C.nid++,a,b,kind:k,dir:(k==="abuse"||k==="focus")?"out":"none"};
  d.edges.push(e);sel={t:"e",id:e.id};save();draw();panel();
  say(e.dir==="out"?`화살표는 ${cut(nodeLabel(node(a)),6)} → ${cut(nodeLabel(node(b)),6)} 방향입니다. 아래에서 바꿀 수 있어요.`:"선을 연결했습니다. 아래에서 종류를 바꿀 수 있어요.");
}
const cancelEdge=()=>{pendE=null;draw();panel();say("")};
const dirNames=(e,a,b)=>`<div class="seg" id="dirSeg">${[["none","─ 없음"],["out",cut(nodeLabel(a),4)+" → "+cut(nodeLabel(b),4)],["in",cut(nodeLabel(b),4)+" → "+cut(nodeLabel(a),4)],["both","↔ 양방향"]].map(([d,t])=>`<button style="font-size:13px;padding:8px 2px" class="${d===(e.dir||"none")?"on3":""}" data-d="${d}" onclick="dirSet('${d}')">${esc(t)}</button>`).join("")}</div>`;
const shapeBtns=e=>{const c=e.bow===undefined?"auto":String(e.bow);return `<div class="seg" id="shapeSeg">${[["auto","자동"],["0","직선"],["46","곡선 ↶"],["-46","곡선 ↷"]].map(([v,t])=>`<button style="font-size:13px;padding:8px 2px" class="${v===c?"on3":""}" data-b="${v}" onclick="bowSet('${v}')">${t}</button>`).join("")}</div>`};
function bowSet(v){const e=curE();if(!e)return;if(v==="auto")delete e.bow;else e.bow=+v;save();draw();markOn("#shapeSeg button","b",v)}
function dirSet(v){const e=curE();if(!e)return;e.dir=v;save();draw();markOn("#panel .seg:not(#shapeSeg) button","d",v)}
function pickPend(k){pend.kind=k;markOn("#panel .lp","k",k)}
function dirPend(d){pend.dir=d;markOn("#panel .seg button","d",d)}
function potPend(v){const nm=($("an")||{}).value||"",ty=($("as")||{}).value;pend.pot=v;if(ty)pend.type=ty;panel();const a=$("an");if(a)a.value=nm}
function cancelPend(){pend=null;draw();panel()}
function addPend(){
  const d=G(),g=T==="geno",type=$("as").value||pend.type,name=($("an").value||"").trim(),aa=$("aa");
  const pot=!g&&!!pend.pot&&type!=="center";
  const n={id:C.nid++,type,label:name||(g?MODES.geno.types[type]:(type==="center"?"가족":type)),x:pend.x,y:pend.y,age:g&&aa?aa.value.trim():"",dead:0,ip:0};
  if(pot)n.pot=1;
  d.nodes.push(n);
  const c=!g&&!pot&&type!=="center"&&d.nodes.find(x=>x.type==="center");
  if(c)d.edges.push({id:C.nid++,a:c.id,b:n.id,kind:pend.kind,dir:pend.dir});
  pend=null;sel={t:"n",id:n.id};save();draw();panel();
}
function delEdge(){const d=G();d.edges=d.edges.filter(e=>e.id!==sel.id);sel=null;save();draw();panel()}

function quickAdd(x,y){
  const d=G(),g=T==="geno",type=g?"female":"친구",c=!g&&d.nodes.find(n=>n.type==="center");
  const n={id:C.nid++,type,label:g?MODES.geno.types[type]:type,x,y,age:"",dead:0,ip:0};
  d.nodes.push(n);
  if(c)d.edges.push({id:C.nid++,a:c.id,b:n.id,kind:"normal",dir:"none"});
  pend=null;sel={t:"n",id:n.id};save();draw();panel();say(g?"인물을 추가했습니다.":"체계를 추가했습니다.");
}
function closeSel(){sel=null;pend=pendE=null;draw();panel()}
function nodeLine(n){
  if(T!=="eco"||n.type==="center")return "";
  const d=G(),c=d.nodes.find(x=>x.type==="center"),e=c&&d.edges.find(x=>(x.a===n.id&&x.b===c.id)||(x.b===n.id&&x.a===c.id));
  return e?`<label>선 종류</label>${lineHtml(MODES.eco.kinds,e.kind,"nkSet")}<label>선 방향</label>${dirBtns(node(e.a),node(e.b),e.dir,"ndSet")}`:"";
}
function linkE(){
  const n=cur();if(!n||T!=="eco")return null;
  const d=G(),c=d.nodes.find(x=>x.type==="center");
  return d.edges.find(x=>c&&((x.a===n.id&&x.b===c.id)||(x.b===n.id&&x.a===c.id)))||null;
}
function sizeSet(v,re){const n=cur();if(!n||T!=="eco")return;v=Math.max(60,Math.min(240,+v||100));if(v===100)delete n.s;else n.s=v/100;save();draw();if(re)panel()}
function potSet(v){
  const n=cur();if(!n||T!=="eco"||n.type==="center")return;
  const d=G(),has=d.edges.some(e=>e.a===n.id||e.b===n.id);
  const apply=()=>{
    if(v){d.edges=d.edges.filter(e=>e.a!==n.id&&e.b!==n.id);n.pot=1}
    else{n.pot=0;const c=d.nodes.find(x=>x.type==="center");if(c&&!d.edges.some(e=>(e.a===n.id&&e.b===c.id)||(e.b===n.id&&e.a===c.id)))d.edges.push({id:C.nid++,a:c.id,b:n.id,kind:"normal",dir:"none"})}
    save();draw();panel();
  };
  if(v&&has){panel();ask("연결된 선이 삭제되고 점선 도형(잠재적 자원)으로 바뀝니다. 계속할까요?","바꾸기",apply);return}
  apply();
}
function nkSet(v){const e=linkE();if(e){e.kind=v;save();draw();markOn("#panel .lp","k",v)}}
function ndSet(v){const e=linkE();if(e){e.dir=v;save();draw();markOn("#panel .seg button","d",v)}}
function bindCanvas(){
  const svg=$("cv");
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:200,y:260}};
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const ptrs=new Map();let pinch=null;
  svg.onpointerdown=e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2&&T==="eco"){ /* 두 번째 손가락: 누르고 있던(또는 선택된) 도형의 크기 조절 시작 */
      const id=drag?drag.id:(sel&&sel.t==="n"?sel.id:null),n=id!=null&&node(id);
      if(n){const[a,b]=[...ptrs.values()];pinch={id,d0:Math.hypot(a.x-b.x,a.y-b.y)||1,s0:n.s||1};drag=null;e.preventDefault();return}
    }
    if(ptrs.size>1)return;
    const ng=e.target.closest(".nd"),eg=e.target.closest(".ed");
    if(tool==="conn"){if(ng){connectTap(+ng.dataset.id);return}setTool(null)}
    if(ng){
      const n=node(+ng.dataset.id),p=pt(e);
      sel={t:"n",id:n.id};pend=pendE=null;drag={id:n.id,dx:n.x-p.x,dy:n.y-p.y};
      try{svg.setPointerCapture(e.pointerId)}catch(_){}draw();panel();e.preventDefault();return;
    }
    if(eg){sel={t:"e",id:+eg.dataset.id};pend=pendE=null}
    else{sel=null;pend=pendE=null;draw();panel();return}
    draw();panel();
  };
  svg.onpointermove=e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch){
      if(ptrs.size>=2){const[a,b]=[...ptrs.values()],n=node(pinch.id);if(n){n.s=Math.round(cl(pinch.s0*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d0,.6,2.4)*100)/100;draw()}}
      return;
    }
    if(!drag)return;
    const n=node(drag.id),p=pt(e);if(!n)return;
    n.x=Math.round(cl(p.x+drag.dx,36,364));n.y=Math.round(cl(p.y+drag.dy,36,484));draw();
  };
  svg.onpointerup=svg.onpointercancel=e=>{
    ptrs.delete(e.pointerId);
    if(pinch){if(ptrs.size<2){pinch=null;save();panel()}return}
    if(drag){drag=null;save()}
  };
}

/* ---------- 내보내기 탭 ---------- */
function outView(){
  return `<div class="card"><b>${C.paid?"결제 완료 · 워터마크 없이 저장됩니다":"미결제 · 워터마크가 포함됩니다"}</b>
    ${C.paid?"":`<div class="row"><button class="pri" onclick="payFlow()">${PRICE}</button></div><p class="note">회원가입 없이 결제 · 이 사례의 가계도·생태도를 PNG·PDF로 워터마크 없이 저장할 수 있습니다. 결제 후 바로 이용하는 디지털 서비스라 저장을 시작하면 환불이 제한됩니다. (<a href="/legal#refund">환불 안내</a>)</p>`}
    <p class="note">미리보기는 저장될 이미지와 같습니다. 범례가 함께 저장됩니다.</p></div>
  ${["geno","eco"].map(m=>`<h2>${MODES[m].title}</h2><div class="sc">${sheetSvg(m,!C.paid,1)}</div>
    <div class="row"><button onclick="exp('${m}','png')">PNG 저장</button><button onclick="exp('${m}','pdf')">PDF 저장</button></div>`).join("")}`;
}

/* ---------- 사정 분석 (한국 사회복지 실천·교육용) ---------- */
const dn=(x,m)=>{const d=((x.kind==="abuse"||x.kind==="focus")&&(x.dir||"none")==="none")?"out":(x.dir||"none");return d==="out"?m[x.a]+"→"+m[x.b]:d==="in"?m[x.b]+"→"+m[x.a]:d==="both"?"양방향":""};
function casePayload(){
  const i=C.info,lb=n=>n.client?"대상자":n.label,m=d=>Object.fromEntries(d.nodes.map(n=>[n.id,lb(n)]));
  const g=C.geno,e=C.eco,mg=m(g),me=m(e);
  return {사례명:C.alias,기본정보:{성별:i.sex,나이:i.age,가구유형:i.house,주요문제:i.issue,경제상황:i.econ,메모:i.memo},
    가계도:{인물:g.nodes.map(n=>({이름:mg[n.id],기호:n.type,나이:n.client?i.age:n.age,사망:!!n.dead,대상자:!!n.ip})),관계:g.edges.map(x=>({a:mg[x.a],b:mg[x.b],종류:GK[x.kind],방향:dn(x,mg)}))},
    생태도:{체계:e.nodes.map(n=>({이름:me[n.id],유형:n.type,잠재자원:!!n.pot})),관계:e.edges.map(x=>({a:me[x.a],b:me[x.b],종류:EK[x.kind],방향:dn(x,me)}))}};
}
function stats(){
  const BAD=["conflict","fusedconf","abuse","cutoff","distant","divorce","separation"],ST=["stress","conflict","cutoff"],SP=["strong","normal","double"],g=C.geno,e=C.eco;
  const c=(d,a)=>d.edges.filter(x=>a.includes(x.kind)).length;
  return {n:g.nodes.length,gb:c(g,BAD),gc:c(g,["close","fused"]),res:e.nodes.filter(n=>n.type!=="center"&&!n.pot).length,pot:e.nodes.filter(n=>n.pot).length,es:c(e,ST),sp:c(e,SP),wk:c(e,["weak","tenuous"])};
}
function localBrief(){const s=stats();return `가계도 ${s.n}명 중 갈등·단절 관계 ${s.gb}건, 생태도 지지 자원 ${s.sp}곳·스트레스 관계 ${s.es}건으로 ${s.gb+s.es>s.sp?"관계 갈등 완화와 지지체계 보강이 우선 과제로 보입니다.":"지지체계를 유지하며 취약 관계를 점검할 필요가 있어 보입니다."}`}
function localReport(){
  const s=stats(),i=C.info;
  return cut(`[사정 요약] ${i.age?i.age+", ":""}${i.house||"가구유형 미기재"}. 가계도 ${s.n}명 중 갈등·단절·소원 관계 ${s.gb}건, 친밀·밀착 ${s.gc}건입니다. 생태도는 지지 자원 ${s.sp}곳, 약한 연결 ${s.wk}곳, 스트레스 관계 ${s.es}건입니다. ${s.pot?`잠재적 자원 ${s.pot}곳은 아직 연결 전입니다. `:""}${i.issue?"주요 욕구: "+cut(i.issue,30)+". ":""}제언: 갈등 관계 개입, 약한 연결 자원 강화, 지지 자원 연계를 우선 검토하세요.`,300);
}
async function runAI(kind){
  const box=$("ai_"+kind);
  if(kind==="brief"){const t=localBrief();C.ai=C.ai||{};C.ai.brief=t;save();if(box)box.textContent=t;return}
  if(!C.paidRep||!C.repOrder)return;
  if(box)box.textContent="보고서를 작성하는 중입니다… (10초 안팎)";
  try{
    const r=await fetch("/api/assess",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderId:C.repOrder,data:casePayload()})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"작성 실패");
    C.ai=C.ai||{};C.ai.report=String(d.text||"");C.ai.sig=d.sig||"";C.repLeft=d.left;save();const mr=$("mail_row");if(mr)mr.style.display="flex";
    const b=$("ai_report");if(b)b.textContent=C.ai.report;
    const l=$("ai_left");if(l)l.textContent=" 남은 횟수 "+d.left+"회";
  }catch(e){
    const b=$("ai_report");if(b)b.textContent="보고서를 만들지 못했습니다. "+e.message+"\n실패한 시도는 횟수에서 차감되지 않습니다. 잠시 후 다시 눌러 주세요.";
  }
}
async function sendMail(){
  const el=$("mail_to"),st=$("mail_st"),to=(el&&el.value||"").trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){if(st)st.textContent="이메일 주소를 확인해 주세요.";return}
  if(!C.ai||!C.ai.report||!C.ai.sig||!C.repOrder)return;
  if(st)st.textContent="보내는 중…";
  try{
    const r=await fetch("/api/mail",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderId:C.repOrder,text:C.ai.report,sig:C.ai.sig,to})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"발송 실패");
    if(st)st.textContent="메일을 보냈습니다. 스팸함도 확인해 주세요.";
  }catch(e){if(st)st.textContent="보내지 못했습니다. "+e.message}
}
function buyReport(){
  ask("보고서 작성을 위해 입력한 사례 정보(이름·거주지 제외)가 외부 서버로 전송됩니다.\n도형 이름에 실명이 있다면 지운 뒤 진행해 주세요.\n결제 후 보고서 작성을 시작하면 환불이 제한됩니다.\n\n동의하고 결제로 넘어갈까요?","동의하고 결제",()=>payFlow(null,"report"));
}
function aiView(){
  const a=C.ai||(C.ai={brief:"",report:""}),bx='style="font-size:14px;line-height:1.7;margin-top:6px;white-space:pre-wrap"',paid=C.paidRep&&C.repOrder,rp=REPORT_WON.toLocaleString("ko-KR")+"원";
  return `<p class="note">한국 사회복지사·사회복지학과 학생을 위한 사정 보조 기능입니다. 한 줄 분석은 무료, 300자 보고서는 유료 기능입니다. 교육·실무 참고용이며 전문적 판단을 대신하지 않습니다.</p>
  <div class="card"><b>한 줄 분석 · 무료</b><div class="row"><button class="pri" onclick="runAI('brief')">분석하기</button></div><div id="ai_brief" ${bx}>${esc(a.brief)}</div></div>
  <div class="card"><b>300자 보고서 · 유료</b><div class="row">${paid?`<button class="pri" onclick="runAI('report')">${a.report?"다시 작성":"보고서 작성"}</button><button onclick="navigator.clipboard&&navigator.clipboard.writeText(C.ai.report||'')">복사</button>`:`<button class="pri" onclick="buyReport()">${rp} 결제하고 보고서 받기</button>`}</div>${paid?`<p class="note">결제 1건당 ${REPORT_USES}회까지 작성할 수 있습니다.<span id="ai_left">${C.repLeft!=null?" 남은 횟수 "+C.repLeft+"회":""}</span></p>`:`<p class="note">회원가입 없이 결제 · 결제 후 바로 보고서가 작성되며, 작성을 시작하면 환불이 제한됩니다. (<a href="/legal#refund">환불 안내</a>)</p>`}<div id="ai_report" ${bx}>${paid?esc(a.report):""}</div>${paid?`<div class="row" id="mail_row" style="${a.report&&a.sig?"":"display:none"}"><input id="mail_to" type="email" inputmode="email" autocomplete="off" placeholder="받을 이메일 주소" aria-label="받을 이메일 주소" style="flex:1;min-width:0"><button onclick="sendMail()">메일로 받기</button></div><div id="mail_st" class="note" role="status"></div>`:""}</div>`;
}

/* ---------- 화면 ---------- */
function go(t){pendE=null;T=t;sel=null;tool=null;from=null;pend=null;render();scrollTo(0,0)}
function caseView(){
  const tabs=[["info","사례등록"],["geno","가계도"],["eco","생태도"],["out","내보내기"],["ai","사정분석"]]
    .map(([k,v])=>`<button role="tab" aria-selected="${T===k}" class="${T===k?"on":""}" onclick="go('${k}')">${v}</button>`).join("");
  return `<div class="top"><button onclick="closeCase()">← 목록</button><b id="hd">${esc(C.alias)}</b></div>
    <div class="tabs" role="tablist">${tabs}</div>
    ${T==="info"?infoView():T==="out"?outView():T==="ai"?aiView():editorView()}`;
}
function render(){
  $("app").innerHTML=C?caseView():listView();
  if(C&&(T==="geno"||T==="eco")){bindCanvas();draw();panel()}
}
load();render();bizFooter();payReturn();
</script>
